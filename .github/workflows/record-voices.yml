name: Record assistant voices (daily)

# Free-tier Gemini keys allow only a few speech requests per day, so this records a little more
# every day into the cache that the APK build bundles. Needs the GEMINI_API_KEY secret.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/offline-voice-assistant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/offline-mobile-voice-camera-kh6fi8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache/restore@v4
        with:
          path: mobile/offline-voice-assistant/voice-recordings
          key: gemini-voice-${{ github.run_id }}
          restore-keys: gemini-voice-
      - name: Record
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ./gradlew --no-daemon -q :brain:exportVoiceScript
          tools/record_all_voices.sh
          for f in brain/build/voice-script/*.json; do
            code=$(basename $f .json)
            echo "$code: $(python3 -c "import json;print(len(json.load(open('app/src/main/assets/voice/$code/index.json'))['clips']))") of $(python3 -c "import json;print(len(json.load(open('$f'))))") clips recorded"
          done
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: mobile/offline-voice-assistant/voice-recordings
          key: gemini-voice-${{ github.run_id }}
